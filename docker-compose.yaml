version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: buildfiles/Dockerfile
    command:
      - "python"
      - "__main__.py"
    env_file:
      - .env
    restart: always
    networks:
      - shared_infra

  flowers:
    build:
      context: .
      dockerfile: buildfiles/Dockerfile
    command:
      - "python"
      - "main_flower.py"
    env_file:
      - .env
    restart: always
    ports:
      - "8000:8000"
    networks:
      - shared_infra

  nginx:
    image: nginx:stable-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - flowers
    networks:
      - shared_infra

networks:
  shared_infra:
    external: true
