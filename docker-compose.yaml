version: "3.9"

services:
  app:
    container_name: money_bot
    build:
      context: .
      dockerfile: buildfiles/Dockerfile
    command:
      - "python"
      - "__main__.py"
    env_file:
      - .env
    restart: always
    networks:
      - shared_infra

networks:
  shared_infra:
    external: true
